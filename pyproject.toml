[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgvector-rag"
version = "0.1.0"
description = "Hybrid retrieval that measures what its approximate index gives up"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["ragx", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
